name: Release (npm Tarball Package)

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.0.1-alpha01 or v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce Git Tag (Fail build if not triggered by tag)
        id: check_tag
        run: |
          RAW_TAG="${{ (github.ref_type == 'tag' && github.ref_name) || inputs.tag_name }}"

          # Strictly fail if ref_type is not a tag and no tag input was supplied
          if [ "${{ github.ref_type }}" != "tag" ] && [ -z "${{ inputs.tag_name }}" ]; then
            echo "::error::Build rejected: Workflow must be triggered with a git tag! Failing build."
            exit 1
          fi

          if [ -z "$RAW_TAG" ]; then
            echo "::error::Build rejected: No git tag specified! Failing build."
            exit 1
          fi

          TAG="${RAW_TAG#refs/tags/}"

          # Validate tag format
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+ ]]; then
            echo "::error::Build rejected: Invalid tag format '$TAG'. Must be a version tag like v0.0.1-alpha01."
            exit 1
          fi

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag verified: $TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit
          else
            npm install --no-audit
          fi

      - name: Build web console & server
        run: npm run build

      - name: Package Release Assets
        id: package
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          mkdir -p release-assets

          # Update version in package.json to match tag
          CLEAN_VERSION="${TAG#v}"
          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version || true

          # Pack npm tarball (.tgz)
          BASE_TARBALL=$(npm pack)
          echo "Generated base npm tarball: $BASE_TARBALL"

          # Create artifacts ending with the tag version (e.g. blamebackend-v0.0.1-alpha01.tgz)
          TAG_TARBALL="blamebackend-${TAG}.tgz"
          cp "$BASE_TARBALL" "release-assets/$TAG_TARBALL"
          cp "$BASE_TARBALL" "release-assets/blamebackend.tgz"

      - name: Verify Artifacts End with Tag Name
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          echo "Verifying that release assets ending with tag '$TAG' were generated..."
          ls -la release-assets/

          if [ ! -f "release-assets/blamebackend-${TAG}.tgz" ]; then
            echo "::error::Verification failed: blamebackend-${TAG}.tgz was not generated!"
            exit 1
          fi

          if [ ! -f "release-assets/blamebackend.tgz" ]; then
            echo "::error::Verification failed: blamebackend.tgz alias was not generated!"
            exit 1
          fi

          echo "Successfully verified release tarball artifacts ending with tag $TAG:"
          find release-assets/ -maxdepth 1 -name "*${TAG}*" -exec basename {} \;

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt 2>/dev/null || shasum -a 256 * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(steps.check_tag.outputs.tag, '-') }}
          generate_release_notes: true

      - name: Publish to npm (optional if NPM_TOKEN secret exists)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          if [[ "$TAG" == *"-"* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
