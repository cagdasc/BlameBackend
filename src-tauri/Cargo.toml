[package]
name = "blamebackend"
version = "0.0.1-alpha01"
description = "Real-time Kotlin Multiplatform Network Inspector & Terminal TUI for Ktor and OkHttp"
authors = ["Cagdas Caglak"]
license = "MIT"
repository = "https://github.com/cagdasc/Vibe-BlameBackend"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "blamebackend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
